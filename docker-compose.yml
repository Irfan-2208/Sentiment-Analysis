version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: socialpulse-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: socialpulse
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: socialpulse-nlp
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - PORT=8000
      - ENABLE_HF_TRANSFORMERS=true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
  hf_cache:
    driver: local
